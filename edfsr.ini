[edfsr]
; master switch for the mod (0 = completely off, game FSR1 untouched)
enabled=1
; upscaler: fsr4 | fsr31 | game   (also changeable in game: CTRL+F8 settings panel)
upscaler=fsr4
; FSR internal sharpening 0..1 (the game's own sharpening still runs after)
sharpness=0.900
; FSR Frame Generation (needs Borderless window mode; enabling takes effect on next game start)
framegen=1
framegen_debug=0
; advanced
jitter=1
jitter_sign_x=1
jitter_sign_y=1
motion_vectors=1
cockpit_depth=6.00
debug_view=0
; 1 = load RenderDoc (F12 captures)
renderdoc=0
