name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only for the release step on v* tags

env:
  LLVM_MINGW_TAG: "20261020"
  LLVM_MINGW_NAME: llvm-mingw-20261020-ucrt-x86_64
  FFX_TAG: v2.4.0
  IMGUI_TAG: v1.91.8
  RENDERDOC_TAG: v1.47

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tool paths
        run: |
          D="$(cygpath -u "$RUNNER_TEMP")/deps"
          echo "DEPS=$D" >> "$GITHUB_ENV"
          echo "DEPS_WIN=$(cygpath -w "$D")" >> "$GITHUB_ENV"

      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DEPS_WIN }}
          key: deps-${{ env.LLVM_MINGW_NAME }}-ffx-${{ env.FFX_TAG }}-imgui-${{ env.IMGUI_TAG }}-rdoc-${{ env.RENDERDOC_TAG }}-v2

      - name: Download dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$DEPS" && cd "$DEPS"

          # llvm-mingw (pinned release)
          curl -sSLf -o llvm-mingw.zip \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_TAG/$LLVM_MINGW_NAME.zip"
          7z x -y -bso0 llvm-mingw.zip
          rm llvm-mingw.zip

          # FidelityFX SDK: headers + signed DX12 runtime DLLs only (sparse, shallow)
          git clone --quiet --depth 1 --branch "$FFX_TAG" --filter=blob:none --sparse \
            https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK.git ffx
          # MSYS_NO_PATHCONV: Git Bash would rewrite the leading-slash patterns into C:/Program Files/Git/...
          MSYS_NO_PATHCONV=1 git -C ffx sparse-checkout set --no-cone \
            /Kits/FidelityFX/api/include/ \
            /Kits/FidelityFX/upscalers/include/ \
            /Kits/FidelityFX/framegeneration/include/ \
            /Kits/FidelityFX/signedbin/amd_fidelityfx_loader_dx12.dll \
            /Kits/FidelityFX/signedbin/amd_fidelityfx_upscaler_dx12.dll \
            /Kits/FidelityFX/signedbin/amd_fidelityfx_framegeneration_dx12.dll
          ls ffx/Kits/FidelityFX/api/include ffx/Kits/FidelityFX/signedbin   # fail early if the sparse checkout missed
          rm -rf ffx/.git

          # Dear ImGui sources
          curl -sSLf -o imgui.tar.gz "https://github.com/ocornut/imgui/archive/refs/tags/$IMGUI_TAG.tar.gz"
          mkdir imgui && tar -xzf imgui.tar.gz -C imgui --strip-components=1
          rm imgui.tar.gz

          # RenderDoc in-application API header
          mkdir renderdoc
          curl -sSLf -o renderdoc/renderdoc_app.h \
            "https://raw.githubusercontent.com/baldurk/renderdoc/$RENDERDOC_TAG/renderdoc/api/app/renderdoc_app.h"

      - name: Build
        run: |
          set -euo pipefail
          LLVM_MINGW="$DEPS/$LLVM_MINGW_NAME" \
          FFX_SDK="$DEPS/ffx" \
          IMGUI_DIR="$DEPS/imgui" \
          RENDERDOC_INC="$DEPS/renderdoc" \
          sh build.sh

      - name: Stage package
        run: |
          set -euo pipefail
          # Package layout = game folder layout: dinput8.dll at the root, mod data in edfsr/
          mkdir -p dist/ed-fsr/edfsr/bin
          cp build/dinput8.dll install.ps1 README.md LICENSE dist/ed-fsr/
          cp edfsr.ini dist/ed-fsr/edfsr/
          cp bin/*.dll dist/ed-fsr/edfsr/bin/
          ls -lR dist/ed-fsr

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed" }
          }
          if ($env:GITHUB_REF -like "refs/tags/v*") { $ver = $env:GITHUB_REF_NAME } else { $ver = "0.0.0-" + $env:GITHUB_SHA.Substring(0, 7) }
          & $iscc "/DAppVersion=$ver" "/DSrcDir=$PWD\dist\ed-fsr" "/DOutDir=$PWD\dist\installer" installer\edfsr.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-ChildItem dist\installer

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ed-fsr
          path: dist/ed-fsr/
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ed-fsr-installer
          path: dist/installer/ED-FSR-Setup-*.exe
          if-no-files-found: error

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          Z="ed-fsr-$GITHUB_REF_NAME.zip"
          (cd dist/ed-fsr && 7z a -tzip -bso0 "../$Z" .)
          gh release create "$GITHUB_REF_NAME" "dist/$Z" "dist/installer/ED-FSR-Setup-$GITHUB_REF_NAME.exe" \
            --title "ED-FSR $GITHUB_REF_NAME" --generate-notes
